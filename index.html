<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>POS El Pistón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
<style>
/* Concepto: escritorio azul acero con una ventana Win32 de caja registradora.
   Chrome clásico (título degradado, menús, barra de herramientas, grillas, barra de estado)
   con bordes nítidos y tipografía legible. El único elemento audaz es el visor LCD del total. */
:root{
  --desk:#2B566B;
  --face:#E7E9ED;
  --field:#FFFFFF;
  --hi:#FFFFFF;
  --lo:#8A93A3;
  --edge:#3F4757;
  --ink:#151A22;
  --ink-dim:#505A6A;
  --line:#CBD2DC;
  --alt:#F1F4F8;
  --title-a:#0A2A6B;
  --title-b:#3A74BA;
  --sel:#1F4E9E;
  --sel-ink:#FFFFFF;
  --ok:#1D7F45;
  --ok-hi:#2E9B5A;
  --warn:#8A5A00;
  --warn-bg:#FFF0C7;
  --bad:#B3261E;
  --bad-bg:#FADAD7;
  --lcd-bg:#08201A;
  --lcd-fg:#7DF9B0;
  --lcd-dim:#4FA37D;
  --ui:"Segoe UI",Tahoma,"Noto Sans",Verdana,sans-serif;
  --mono:Consolas,"Liberation Mono",Menlo,monospace;
  --lcd:"Share Tech Mono",Consolas,"Courier New",monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;height:100%;padding:16px;background:var(--desk);color:var(--ink);font:13px/1.35 var(--ui);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
kbd{font:inherit}
.dim{color:var(--ink-dim)}
.mono{font-family:var(--mono);font-size:12px}
.r{text-align:right}
.c{text-align:center}

.win{display:flex;flex-direction:column;height:100%;min-height:640px;background:var(--face);border:1px solid var(--edge);box-shadow:inset 1px 1px 0 var(--hi),0 10px 28px rgba(0,0,0,.4)}
.titlebar{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 8px;min-height:28px;background:linear-gradient(90deg,var(--title-a),var(--title-b));color:#fff;font-weight:600;user-select:none}
.titlebar .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appico{width:16px;height:16px;flex:none}
.wctl{display:flex;gap:2px}
.wbtn{width:22px;height:20px;display:grid;place-items:center;padding:0;background:var(--face);color:var(--ink);border:1px solid var(--edge);border-radius:0;box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo);font-size:11px;line-height:1}
button.wbtn{cursor:pointer}
button.wbtn:focus-visible{outline:2px solid #fff;outline-offset:1px}

.menubar{display:flex;padding:2px 4px;border-bottom:1px solid var(--lo);box-shadow:0 1px 0 var(--hi);overflow-x:auto;scrollbar-width:thin}
.mb{background:transparent;border:1px solid transparent;padding:3px 10px;cursor:default;white-space:nowrap}
.mb:hover,.mb.open{background:var(--sel);color:var(--sel-ink)}
.mb:focus-visible{outline:2px solid var(--sel);outline-offset:-2px}
.menu{position:fixed;z-index:80;min-width:250px;padding:2px;background:var(--face);border:1px solid var(--edge);box-shadow:3px 3px 8px rgba(0,0,0,.35),inset 1px 1px 0 var(--hi)}
.mi{display:flex;justify-content:space-between;gap:24px;width:100%;padding:4px 10px;background:transparent;border:0;text-align:left;cursor:default}
.mi kbd{color:var(--ink-dim)}
.mi:hover,.mi:focus-visible{background:var(--sel);color:var(--sel-ink);outline:0}
.mi:hover kbd,.mi:focus-visible kbd{color:#cfe0ff}
.msep{height:1px;margin:3px 2px;background:var(--lo);box-shadow:0 1px 0 var(--hi)}

.toolbar{display:flex;align-items:stretch;gap:2px;padding:4px;border-bottom:1px solid var(--lo);box-shadow:0 1px 0 var(--hi);overflow-x:auto;scrollbar-width:thin}
.tb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:66px;padding:3px 6px;background:transparent;border:1px solid transparent;border-radius:2px;cursor:pointer;white-space:nowrap}
.tb svg{width:20px;height:20px}
.tb b{font-weight:400;font-size:11.5px}
.tb kbd{font-size:10px;color:var(--ink-dim)}
.tb:hover{background:var(--face);border-color:var(--edge);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo)}
.tb:active{box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi)}
.tb:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.tsep{flex:none;width:1px;margin:2px 4px;background:var(--lo);box-shadow:1px 0 0 var(--hi)}
.badge{position:absolute;top:0;right:3px;min-width:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;line-height:15px;text-align:center}

.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:6px;padding:6px}
.left{display:flex;flex-direction:column;gap:6px;min-width:0;min-height:0}
.group{background:var(--face);border:1px solid var(--lo);box-shadow:1px 1px 0 var(--hi),inset 1px 1px 0 var(--hi);padding:6px 8px}
.gtitle{font-weight:600;color:var(--title-a);margin-bottom:4px}

.docgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 10px}
.f{display:flex;flex-direction:column;gap:2px;min-width:0}
.f.wide{grid-column:span 2}
.f label,.entry label,.catbar label,.invbar label{font-size:11.5px;color:var(--ink-dim)}
.row{display:flex;gap:4px;min-width:0}
.row .fld{flex:1;min-width:0}

.fld{min-height:26px;min-width:0;padding:3px 6px;background:var(--field);color:var(--ink);border:1px solid var(--lo);border-top-color:var(--edge);border-left-color:var(--edge);border-radius:0;box-shadow:inset 1px 1px 0 rgba(0,0,0,.1)}
.fld[readonly]{background:#F6F7F9}
.fld:focus-visible{outline:2px solid var(--sel);outline-offset:-1px}
.fld.big{font-size:15px;min-height:32px}
.fld.cell{width:84px;min-height:24px;padding:1px 4px}
select.fld{padding-right:2px}

.btn{min-height:26px;padding:3px 12px;background:var(--face);color:var(--ink);border:1px solid var(--edge);border-radius:2px;box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo);cursor:pointer;white-space:nowrap}
.btn:active:not(:disabled){box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi)}
.btn:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--ok);color:#fff;border-color:#0F4F2A;box-shadow:inset 1px 1px 0 var(--ok-hi),inset -1px -1px 0 #0F5A2E;font-weight:600}
.btn.mini2{min-height:22px;padding:0 8px}

.entry{display:flex;align-items:flex-end;gap:6px;flex-wrap:wrap}
.entry>div{flex:1;min-width:220px;display:flex;flex-direction:column;gap:2px}
.entry .fld{width:100%}

.gridwrap{position:relative;flex:1;min-height:0;overflow:auto;background:var(--field);border:1px solid var(--lo);border-top-color:var(--edge);border-left-color:var(--edge)}
.grid{width:100%;border-collapse:separate;border-spacing:0}
.grid th{position:sticky;top:0;z-index:1;padding:4px 6px;text-align:left;font-weight:600;white-space:nowrap;background:var(--face);border-right:1px solid var(--lo);border-bottom:1px solid var(--edge);box-shadow:inset 1px 1px 0 var(--hi)}
.grid th.r{text-align:right}
.grid th.c{text-align:center}
.grid td{padding:3px 6px;vertical-align:middle;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.grid tbody tr:nth-child(even) td{background:var(--alt)}
.grid tbody tr[data-i],.grid tbody tr[data-code],.grid tbody tr[data-no],.grid tbody tr[data-cl]{cursor:default}
.grid tbody tr.sel td{background:var(--sel);color:var(--sel-ink);border-color:#17396F}
.grid tbody tr.sel .sub{color:#CFE0FF}
.grid tbody tr.empty td{padding:30px 14px;text-align:center;color:var(--ink-dim);background:var(--field)}
.grid td.st-out{background:var(--bad-bg);color:var(--bad);font-weight:600}
.grid td.st-low{background:var(--warn-bg);color:var(--warn);font-weight:600}
.grid tr.rowout td{background:var(--bad-bg)}
.grid tr.rowlow td{background:var(--warn-bg)}
.grid tr.void td{color:var(--ink-dim);text-decoration:line-through}
.desc{font-weight:600}
.sub{font-size:11.5px;color:var(--ink-dim);font-weight:400}
.cart{min-width:780px}
.catgrid{min-width:0}
.qty{display:inline-flex;align-items:center;gap:3px}
.qv{min-width:34px;text-align:center;font-weight:600}
.mini{width:20px;height:20px;padding:0;line-height:1;background:var(--face);color:var(--ink);border:1px solid var(--edge);border-radius:2px;box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo);cursor:pointer}
.grid tr.sel .mini{color:var(--ink)}
.mini:focus-visible{outline:2px solid #fff;outline-offset:1px}

.bottom{display:grid;grid-template-columns:minmax(260px,1fr) minmax(0,1.25fr) 150px;gap:6px;align-items:stretch}
.sumt{width:100%;border-collapse:collapse;background:var(--field);border:1px solid var(--lo);border-top-color:var(--edge);border-left-color:var(--edge)}
.sumt th{padding:2px 8px;text-align:left;font-weight:600;font-size:11.5px;background:var(--face);border-bottom:1px solid var(--lo)}
.sumt th.r{text-align:right}
.sumt td{padding:2px 8px;border-bottom:1px solid var(--line)}
.sumt tr.tot td{font-weight:700;background:var(--alt);border-top:1px solid var(--edge)}
.sumt .warn td{color:var(--warn);font-weight:600}
.sumt .good td{color:var(--ok);font-weight:600}
.lcd{display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;padding:8px 14px;background:var(--lcd-bg);border:2px solid var(--edge);border-right-color:var(--hi);border-bottom-color:var(--hi);box-shadow:inset 0 0 14px rgba(0,0,0,.7)}
.lcd-label{font:11px var(--ui);letter-spacing:.12em;color:var(--lcd-dim)}
.lcd-bs{font:clamp(26px,3.6vw,40px)/1.05 var(--lcd);color:var(--lcd-fg);text-shadow:0 0 8px rgba(125,249,176,.45);text-align:right;overflow-wrap:anywhere}
.lcd-usd{font:clamp(16px,2vw,21px)/1.1 var(--lcd);color:var(--lcd-dim);text-align:right}
.cobrar{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:18px;letter-spacing:.04em}
.cobrar small{font-size:11px;font-weight:400;opacity:.85}

.cat{display:flex;flex-direction:column;gap:6px;min-width:0;min-height:0}
.catbar{display:flex;align-items:center;gap:6px}
.catbar .fld{flex:1}
.detail{min-height:118px;padding:6px 8px;background:var(--field);border:1px solid var(--lo);border-top-color:var(--edge);border-left-color:var(--edge);display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.dgrid{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;width:100%}
.dgrid span{color:var(--ink-dim)}
.dgrid b.st-out{color:var(--bad)}
.dgrid b.st-low{color:var(--warn)}

.statusbar{display:flex;gap:2px;padding:3px 4px;border-top:1px solid var(--hi);box-shadow:0 -1px 0 var(--lo);overflow-x:auto;font-size:12px;scrollbar-width:thin}
.sp{padding:2px 8px;white-space:nowrap;background:transparent;border:1px solid var(--lo);border-right-color:var(--hi);border-bottom-color:var(--hi)}
.sp.msg{flex:1;min-width:240px}
.sp.msg.bad{color:var(--bad);font-weight:600}
button.sp{cursor:pointer}
button.sp:hover{background:var(--alt)}
button.sp:focus-visible{outline:2px solid var(--sel);outline-offset:-2px}

.backdrop{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:rgba(8,18,38,.5)}
.dlg{display:flex;flex-direction:column;width:min(var(--w,520px),100%);max-height:100%;background:var(--face);border:1px solid var(--edge);box-shadow:0 12px 34px rgba(0,0,0,.5),inset 1px 1px 0 var(--hi)}
.dlg .body{padding:10px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:8px}
.dlg .foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;padding:8px 10px;border-top:1px solid var(--lo);box-shadow:0 -1px 0 var(--hi)}
.hint{margin:0;font-size:12px;color:var(--ink-dim)}
.form{display:flex;flex-direction:column;gap:8px}
.radios{display:flex;flex-direction:column;gap:4px}
.radios label,.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink)}
.invbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
.invbar .fld{flex:1;min-width:160px}
.invwrap,.clwrap,.paywrap,.saleswrap,.heldwrap{flex:none;max-height:340px}
.newp{border:1px solid var(--lo);padding:6px 8px;background:var(--face)}
.newp summary{cursor:pointer;font-weight:600;color:var(--title-a)}
.newgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px 10px;margin:8px 0}
.paytop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:8px}
.pin{width:130px}
.ticket{margin:0;padding:12px;background:#fff;color:#111;border:1px solid var(--lo);font:12px/1.35 var(--lcd);white-space:pre;overflow:auto}
.cierre{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.cierre .sumt td:nth-child(n+2){text-align:right}

@media (max-width:980px){
  html,body{height:auto}
  .win{height:auto;min-height:0}
  .main{grid-template-columns:minmax(0,1fr);overflow:visible}
  .left .gridwrap{flex:none;min-height:200px;max-height:340px}
  .cat .gridwrap{flex:none;max-height:320px}
  .bottom{grid-template-columns:minmax(0,1fr)}
  .cobrar{min-height:54px;flex-direction:row;gap:10px}
  .paytop{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="win" id="win">
  <div class="titlebar">
    <svg class="appico" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="1" width="10" height="5" fill="#fff" stroke="#0a2a6b"/><rect x="5" y="6" width="6" height="6" fill="#cbd5e1" stroke="#0a2a6b"/><circle cx="8" cy="13" r="2.4" fill="#e0a526" stroke="#0a2a6b"/></svg>
    <span class="ttl" id="winTitle"></span>
    <span class="wctl" aria-hidden="true"><span class="wbtn">&#8211;</span><span class="wbtn">&#9633;</span><span class="wbtn">&#10005;</span></span>
  </div>
  <div class="menubar" id="menubar" role="menubar" aria-label="Menú principal"></div>
  <div class="toolbar" id="toolbar" role="toolbar" aria-label="Acciones de venta"></div>

  <div class="main">
    <section class="left" aria-label="Venta actual">
      <div class="group">
        <div class="gtitle">Documento de venta</div>
        <div class="docgrid">
          <div class="f"><label for="fNo">Factura Nº</label><input class="fld mono" id="fNo" readonly></div>
          <div class="f"><label for="fDate">Fecha y hora</label><input class="fld" id="fDate" readonly></div>
          <div class="f wide"><label for="fClient">Cliente</label><div class="row"><input class="fld" id="fClient" readonly><button class="btn mini2" id="btnClient" title="Seleccionar cliente (F4)" aria-label="Seleccionar cliente">&hellip;</button></div></div>
          <div class="f"><label for="fRif">RIF / C.I.</label><input class="fld" id="fRif" readonly></div>
          <div class="f"><label for="fCajero">Cajero</label><input class="fld" id="fCajero" readonly></div>
        </div>
      </div>

      <div class="entry">
        <div>
          <label for="entry">Código de barras o descripción &nbsp;·&nbsp; use 3*texto para varias unidades</label>
          <input class="fld big" id="entry" autocomplete="off" spellcheck="false" placeholder="Escanee o escriba, ej: 20w50, filtro, 3*7504001">
        </div>
        <button class="btn" id="btnAdd">Agregar</button>
      </div>

      <div class="gridwrap" id="cartWrap">
        <table class="grid cart" aria-label="Renglones de la venta">
          <thead><tr>
            <th class="c" style="width:34px">#</th><th style="width:84px">Código</th><th>Descripción</th>
            <th class="c" style="width:104px">Cantidad</th><th class="r" style="width:84px">P. unit. US$</th>
            <th class="r" style="width:60px">Desc.</th><th class="r" style="width:90px" title="Sin IVA">Total US$</th><th class="r" style="width:116px" title="Sin IVA">Total Bs.</th>
          </tr></thead>
          <tbody id="cartBody"></tbody>
        </table>
      </div>

      <div class="bottom">
        <table class="sumt" aria-label="Resumen de la venta">
          <thead><tr><th>Concepto</th><th class="r">US$</th><th class="r">Bs.</th></tr></thead>
          <tbody id="sumBody"></tbody>
        </table>
        <div class="lcd" aria-live="polite">
          <div class="lcd-label">TOTAL A PAGAR (CON IVA)</div>
          <div class="lcd-bs" id="lcdBs"></div>

        </div>
        <button class="btn primary cobrar" id="btnPay"><span>COBRAR</span><small>F12</small></button>

    <aside class="cat group" aria-label="Catálogo de productos">

        <table class="grid catgrid">
          <thead><tr><th>Producto</th><th class="r">Exist.</th><th class="r">US$</th><th></th></tr></thead>
          <tbody id="catBody"></tbody>
        </table>
      </div>
      <div class="detail" id="detail"></div>
    </aside>
  </div>

  <div class="statusbar" id="statusbar">
    <div class="sp msg" id="sbMsg" role="status"></div>
    <div class="sp" id="sbCajero"></div>
    <button class="sp" id="sbRate" title="Cambiar tasa de cambio"></button>
    <div class="sp" id="sbCount"></div>
    <div class="sp" id="sbClock"></div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ---------- utilidades ---------- */
const IVA=0.16, IGTF=0.03, KEY='pos-el-piston-v1';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const nf=n=>{const neg=n<0;const p=Math.abs(r2(n)).toFixed(2).split('.');return (neg?'-':'')+p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+p[1];};
const usd=n=>'US$ '+nf(n);
const bsf=n=>'Bs. '+nf(n);
const fq=q=>Number.isInteger(q)?String(q):String(r2(q)).replace('.',',');
const two=n=>String(n).padStart(2,'0');
const pad=n=>String(n).padStart(8,'0');
const fmtD=d=>two(d.getDate())+'/'+two(d.getMonth()+1)+'/'+d.getFullYear();
const fmtT=d=>two(d.getHours())+':'+two(d.getMinutes());
const fmtDT=ts=>{const d=new Date(ts);return fmtD(d)+' '+fmtT(d);};
const sameDay=ts=>new Date(ts).toDateString()===new Date().toDateString();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
const pn=s=>{s=String(s).trim();if(!s)return 0;if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)&&n>0?n:0;};
const h=html=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild;};

/* ---------- datos de ejemplo ---------- */
const P=(code,desc,brand,cat,price,stock,min,loc,unit)=>({code,desc,brand,cat,price,stock,min,loc,unit:unit||'und'});
const SEED=[
 P('7501001','Aceite 20W-50 Mineral 1 L','Castrol GTX','Aceites de motor',5.20,48,12,'A-1'),
 P('7501002','Aceite 20W-50 Mineral Galón 4 L','Castrol GTX','Aceites de motor',19.50,14,6,'A-1'),
 P('7501003','Aceite 10W-40 Semisintético 1 L','Mobil Super','Aceites de motor',7.80,30,10,'A-2'),

/* ---------- cálculos ---------- */
function lineInfo(l){const p=prod(l.code),gross=r2(p.price*l.qty),net=r2(gross*(1-l.disc/100));return{p,gross,net};}
function totals(){
  let sub=0,base=0;
  S.cart.forEach(l=>{const i=lineInfo(l);sub+=i.gross;base+=i.net;});
  sub=r2(sub);base=r2(base);
  const iva=r2(base*IVA);
  return{sub,disc:r2(sub-base),base,iva,total:r2(base+iva)};
}
function calcPay(tot,rate,amts){
  let usdT=0,bsT=0;
  METHODS.forEach(m=>{const a=amts[m.id]||0;if(m.cur==='USD')usdT+=a;else bsT+=a;});
  const bsUsd=bsT/rate;
  const usdApplied=Math.min(usdT/(1+IGTF),Math.max(0,tot-bsUsd));
  const igtf=r2(usdApplied*IGTF);
  const paid=bsUsd+usdApplied;
  const pending=Math.max(0,tot-paid);
  const change=Math.max(0,usdT-usdApplied*(1+IGTF))+Math.max(0,bsUsd-tot);
  return{usdT,bsT,igtf,pending,change,due:r2(tot+igtf)};
}
function searchProducts(text,cat){
  const toks=text.split(/\s+/).map(norm).filter(Boolean);
  return S.products.filter(p=>(cat==='Todas'||p.cat===cat)&&toks.every(t=>norm(p.code+p.desc+p.brand).indexOf(t)>=0));
}

      if(o.onEnter)o.onEnter();
      else{const p=$('.btn.primary',foot);if(p&&!p.disabled)p.click();}
    }
  });
  W={el:bd,prev:document.activeElement};
  $('#win').inert=true;

  if(!bd.contains(document.activeElement)){const f=$('input:not([readonly]),select',body)||$('.btn.primary',foot);if(f)f.focus();}
}
function closeWin(silent){
  if(!W)return;
  W.el.remove();$('#win').inert=false;

}

/* ---------- carrito ---------- */
function addItem(code,qty){
  const p=prod(code);if(!p)return false;
  qty=p.unit==='L'?Math.max(0.1,r2(qty)):Math.max(1,Math.round(qty));
  const ex=S.cart.find(l=>l.code===code),cur=ex?ex.qty:0,left=r2(p.stock-cur);
  if(qty>left+1e-9){
    msg(left<=0?'Sin existencia de "'+p.desc+'" ('+p.brand+').':'Existencia insuficiente de "'+p.desc+'": quedan '+fq(left)+'.','bad');
    return false;
  }
  if(ex){ex.qty=r2(ex.qty+qty);S.sel=S.cart.indexOf(ex);}
  else{S.cart.push({code,qty,disc:0});S.sel=S.cart.length-1;}
  renderCart();
  ensureVisible($('#cartBody tr.sel'),$('#cartWrap'));
  msg(p.brand+' '+p.desc+' agregado.');
  return true;
}
function changeQty(i,d){
  const l=S.cart[i];if(!l)return;
  const p=prod(l.code),min=p.unit==='L'?0.1:1,nq=r2(l.qty+d);
  if(nq<min){msg('La cantidad mínima es '+fq(min)+'. Use Quitar para eliminar el renglón.');return;}
  if(nq>p.stock+1e-9){msg('Existencia insuficiente: quedan '+fq(p.stock)+'.','bad');return;}
  l.qty=nq;renderCart();
}
function removeSel(){
  if(S.sel<0||!S.cart[S.sel]){msg('Seleccione un renglón para quitarlo.','bad');return;}
  const p=prod(S.cart[S.sel].code);
  S.cart.splice(S.sel,1);S.sel=Math.min(S.sel,S.cart.length-1);
  renderCart();msg('Renglón quitado: '+p.desc+'.');
}

  el.addEventListener('change',e=>{

    const f=e.target.dataset.f;if(!f)return;
    const tr=e.target.closest('tr'),p=prod(tr.dataset.code),v=pn(e.target.value);
    if(f==='stock'){p.stock=e.target.value.trim()==='0'?0:(v||p.stock);}
    else if(f==='min'){p.min=e.target.value.trim()==='0'?0:(v||p.min);}
    else if(f==='price'){p.price=v||p.price;}
    e.target.value=f==='price'?nf(p[f]):fq(p[f]);

/* ---------- cobro ---------- */
function payDlg(){
  if(!S.cart.length){msg('Agregue productos antes de cobrar.','bad');return;}
  const t=totals(),rate=S.cfg.rate;
  const rowsHtml=METHODS.map(m=>'<tr><td>'+esc(m.name)+'</td><td>'+(m.cur==='USD'?'US$':'Bs.')+'</td><td class="r"><input class="fld r pin" id="pm-'+m.id+'" data-m="'+m.id+'" inputmode="decimal" autocomplete="off" aria-label="Monto recibido en '+esc(m.name)+'"></td><td><button class="btn mini2" data-fill="'+m.id+'">Saldo</button></td></tr>').join('');
  const el=h('<div class="form"><div class="paytop"><div class="lcd"><div class="lcd-label">TOTAL FACTURA</div><div class="lcd-bs">'+bsf(t.total*rate)+'</div><div class="lcd-usd">'+usd(t.total)+'</div></div><table class="sumt"><thead><tr><th>Concepto</th><th class="r">US$</th><th class="r">Bs.</th></tr></thead><tbody id="payRes"></tbody></table></div><div class="gridwrap paywrap"><table class="grid"><thead><tr><th>Forma de pago</th><th>Moneda</th><th class="r">Monto recibido</th><th></th></tr></thead><tbody>'+rowsHtml+'</tbody></table></div><p class="hint">Los pagos en divisas (efectivo US$ y Zelle) generan IGTF de 3 %. «Saldo» completa lo que falta en esa forma de pago.</p></div>');
  const amts=()=>{const o={};METHODS.forEach(m=>{o[m.id]=pn($('#pm-'+m.id,el).value);});return o;};
  let last=null;
  const upd=()=>{
    const st=calcPay(t.total,rate,amts());last=st;
    const row=(c,a,cls,tot)=>'<tr class="'+(cls||'')+(tot?' tot':'')+'"><td>'+c+'</td><td class="r">'+nf(a)+'</td><td class="r">'+nf(a*rate)+'</td></tr>';
    let html=row('Total factura',t.total)+row('IGTF 3 % (divisas)',st.igtf)+row('Total a cobrar',st.due,'',true);
    if(st.pending>=0.01)html+=row('Falta por cobrar',st.pending,'warn');
    else if(st.change>=0.01)html+=row('Vuelto al cliente',st.change,'good');
    else html+='<tr class="good"><td colspan="3">Saldo cubierto. Puede confirmar el cobro.</td></tr>';
    $('#payRes',el).innerHTML=html;
    const b=$('#btnConfirm');if(b)b.disabled=!(st.pending<0.01);
  };
  el.addEventListener('input',e=>{if(e.target.matches('.pin'))upd();});
  el.addEventListener('click',e=>{
    const b=e.target.closest('[data-fill]');if(!b)return;
    const m=METHODS.find(x=>x.id===b.dataset.fill),inp=$('#pm-'+m.id,el);
    inp.value='';
    const st=calcPay(t.total,rate,amts());
    if(st.pending>=0.005){inp.value=nf(m.cur==='USD'?r2(st.pending*(1+IGTF)):r2(st.pending*rate));}
    upd();inp.focus();inp.select();
  });
  openWin({title:'Cobrar factura '+pad(S.invoice),w:700,body:el,
    foot:[{label:'Cancelar'},{id:'btnConfirm',label:'Confirmar cobro',primary:true,fn:()=>{
      if(!last||last.pending>=0.01)return false;
      finalize(last,amts());return false;
    }}],
    onOpen:()=>{upd();$('#pm-efUSD',el).focus();}});
}
function finalize(st,amts){
  const t=totals();
  const lines=S.cart.map(l=>{const i=lineInfo(l);return{code:l.code,desc:i.p.brand+' '+i.p.desc,qty:l.qty,price:i.p.price,disc:l.disc,net:i.net};});
  const pays=METHODS.filter(m=>amts[m.id]>0).map(m=>({id:m.id,name:m.name,cur:m.cur,amount:r2(amts[m.id])}));
  const sale={no:S.invoice,ts:Date.now(),client:Object.assign({},S.client),lines,sub:t.sub,disc:t.disc,base:t.base,iva:t.iva,total:t.total,igtf:st.igtf,rate:S.cfg.rate,pays,change:r2(st.change),void:false};
  S.cart.forEach(l=>{const p=prod(l.code);p.stock=Math.max(0,r2(p.stock-l.qty));});
  S.sales.push(sale);S.invoice++;S.cart=[];S.sel=-1;S.client=S.clients[0];
  save();renderAll();
  msg('Factura '+pad(sale.no)+' cobrada por '+usd(r2(sale.total+sale.igtf))+'.');
  showTicket(sale);
}
function ticketText(s){
  const Wd=40,ln='-'.repeat(Wd);
  const ctr=t=>' '.repeat(Math.max(0,Math.floor((Wd-t.length)/2)))+t;
  const row=(a,b)=>{a=String(a);b=String(b);return a+' '.repeat(Math.max(1,Wd-a.length-b.length))+b;};
  const cut=(t,n)=>t.length>n?t.slice(0,n-1)+'…':t;
  const L=[];
  if(s.void)L.push(ctr('*** VENTA ANULADA ***'));
  L.push(ctr(cut(S.cfg.empresa.toUpperCase(),Wd)),ctr('RIF '+S.cfg.rif));
  if(S.cfg.dir)L.push(ctr(cut(S.cfg.dir,Wd)));
  L.push(ln,row('FACTURA '+pad(s.no),fmtDT(s.ts)),row('Cajero: '+S.cfg.cajero,'Caja '+S.cfg.caja),'Cliente: '+cut(s.client.name,Wd-9),'RIF/C.I.: '+s.client.rif,ln);
  s.lines.forEach(l=>{
    L.push(cut(l.desc,Wd));
    L.push(row('  '+fq(l.qty)+' x '+nf(l.price)+(l.disc?'  -'+fq(l.disc)+'%':''),nf(l.net)));
  });
  L.push(ln,row('Subtotal US$',nf(s.sub)));
  if(s.disc)L.push(row('Descuento US$','-'+nf(s.disc)));
  L.push(row('Base imponible US$',nf(s.base)),row('IVA 16 % US$',nf(s.iva)));
  if(s.igtf)L.push(row('IGTF 3 % US$',nf(s.igtf)));
  const due=r2(s.total+s.igtf);
  L.push(ln,row('TOTAL US$',nf(due)),row('TOTAL Bs. (tasa '+nf(s.rate)+')',nf(due*s.rate)),ln,'FORMAS DE PAGO');
  s.pays.forEach(p=>L.push(row(cut(p.name,26),(p.cur==='USD'?'US$ ':'Bs. ')+nf(p.amount))));
  if(s.change>=0.01)L.push(row('Vuelto (equiv. US$)',nf(s.change)));
  L.push(ln,ctr('Gracias por su compra'),ctr('Documento de control interno'));
  return L.join('\n');
}
function showTicket(s){
  const el=h('<div class="form"><pre class="ticket" id="ticketPre"></pre><p class="hint">Este ticket es un comprobante interno. No sustituye la factura fiscal de su impresora homologada.</p></div>');
  $('#ticketPre',el).textContent=ticketText(s);
  openWin({title:'Factura '+pad(s.no),w:460,body:el,foot:[
    {label:'Copiar texto',fn:()=>{
      const txt=ticketText(s),pre=$('#ticketPre',el);
      const fallback=()=>{const r=document.createRange();r.selectNodeContents(pre);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);msg('Texto seleccionado. Cópielo con Ctrl+C.');};
      try{navigator.clipboard.writeText(txt).then(()=>msg('Ticket copiado.'),fallback);}catch(e){fallback();}
      return false;
    }},
    {label:'Cerrar',primary:true,fn:()=>{setTimeout(()=>$('#entry').focus(),0);}}
  ]});
}

    const sum=(f)=>r2(ok.reduce((a,s)=>a+f(s),0));
    const metRows=Object.keys(by).map(k=>'<tr><td>'+esc(by[k].name.split(' (')[0])+'</td><td>'+by[k].n+'</td><td>'+(by[k].cur==='USD'?'US$ ':'Bs. ')+nf(by[k].amt)+'</td></tr>').join('')||'<tr><td colspan="3" class="dim">Sin cobros.</td></tr>';

    $('#saNote',el).textContent=list.some(s=>s.no<1043)&&!saved?'Las facturas 1038 a 1042 son ejemplos para mostrar el cierre.':'';
    $('#saView',el).disabled=!selNo;$('#saVoid',el).disabled=!selNo||!!(S.sales.find(s=>s.no===selNo)||{}).void;
    $('#saVoid',el).textContent='Anular venta';
  };
  el.addEventListener('click',e=>{
    const tr=e.target.closest('tr[data-no]');
    if(tr){selNo=+tr.dataset.no;armed=0;draw();return;}
    const s=S.sales.find(x=>x.no===selNo);

    if(e.target.id==='saVoid'&&s&&!s.void){
      if(!armed||Date.now()-armed>5000){armed=Date.now();e.target.textContent='Confirmar anulación';return;}

      armed=0;save();renderCatalog();draw();msg('Factura '+pad(s.no)+' anulada. Se devolvió la mercancía al inventario.');
    }
  });
  openWin({title:'Ventas del día y cierre de caja',w:900,body:el,foot:[{label:'Cerrar',primary:true}],onEnter:()=>{},onOpen:()=>{draw();}});

const TB=[
 ['nueva','Nueva','F2',newSale],['buscar','Buscar','F3',focusEntry],['cliente','Cliente','F4',clientDlg],
 ['suspender','Suspender','F5',suspend],['recuperar','Recuperar','F6',recoverDlg],['descuento','Descuento','F7',discountDlg],['quitar','Quitar','Supr',removeSel],
 '-',['inventario','Inventario','F8',inventoryDlg],['ventas','Ventas del día','F9',salesDlg],['tasa','Tasa','',()=>cfgDlg('cRate')]
];
function buildChrome(){
  $('#menubar').innerHTML=Object.keys(MENUS).map(k=>'<button class="mb" role="menuitem" data-menu="'+esc(k)+'">'+esc(k)+'</button>').join('');
  $('#toolbar').innerHTML=TB.map(t=>t==='-'?'<span class="tsep"></span>':'<button class="tb" data-tb="'+t[0]+'" title="'+esc(t[1])+(t[2]?' ('+t[2]+')':'')+'">'+ico(t[0])+'<b>'+esc(t[1])+'</b><kbd>'+esc(t[2]||' ')+'</kbd>'+(t[0]==='recuperar'?'<span class="badge" id="heldBadge" hidden></span>':'')+'</button>').join('');
}

/* ---------- render ---------- */
function ensureVisible(tr,wrap){
  if(!tr||!wrap)return;
  const th=wrap.querySelector('thead'),hh=th?th.offsetHeight:0;
  const top=tr.offsetTop-hh,bot=tr.offsetTop+tr.offsetHeight;
  if(top<wrap.scrollTop)wrap.scrollTop=top;else if(bot>wrap.scrollTop+wrap.clientHeight)wrap.scrollTop=bot-wrap.clientHeight;
}
function renderHeader(){
  const c=S.cfg;
  $('#winTitle').textContent=c.empresa+' — Punto de venta [Caja '+c.caja+']';
  $('#fNo').value=pad(S.invoice);
  $('#fDate').value=fmtDT(Date.now());
  $('#fClient').value=S.client.name;
  $('#fRif').value=S.client.rif;
  $('#fCajero').value=c.cajero;
}
function renderCatOptions(){
  const cats=['Todas'].concat(Array.from(new Set(S.products.map(p=>p.cat))));
  if(cats.indexOf(S.cat)<0)S.cat='Todas';
  $('#catSel').innerHTML=cats.map(c=>'<option'+(c===S.cat?' selected':'')+'>'+esc(c)+'</option>').join('');
}
function renderCart(){
  const tb=$('#cartBody'),rate=S.cfg.rate;
  if(!S.cart.length){
    tb.innerHTML='<tr class="empty"><td colspan="8">Venta vacía. Escanee un código de barras o escriba la descripción del producto en la caja de arriba.</td></tr>';
  }else{
    tb.innerHTML=S.cart.map((l,i)=>{
      const x=lineInfo(l),p=x.p;
      return '<tr data-i="'+i+'" class="'+(i===S.sel?'sel':'')+'"><td class="c">'+(i+1)+'</td><td class="mono">'+esc(p.code)+'</td><td><div class="desc">'+esc(p.desc)+'</div><div class="sub">'+esc(p.brand)+' · pasillo '+esc(p.loc)+'</div></td><td class="c"><span class="qty"><button class="mini" data-act="dec" aria-label="Restar una unidad">&minus;</button><span class="qv">'+fq(l.qty)+(p.unit==='L'?' L':'')+'</span><button class="mini" data-act="inc" aria-label="Sumar una unidad">+</button></span></td><td class="r">'+nf(p.price)+'</td><td class="r">'+(l.disc?fq(l.disc)+' %':'')+'</td><td class="r">'+nf(x.net)+'</td><td class="r">'+nf(r2(x.net*rate))+'</td></tr>';
    }).join('');
  }
  renderTotals();renderStatus();
}
function renderTotals(){
  const t=totals(),r=S.cfg.rate;
  const row=(c,a,cls)=>'<tr class="'+(cls||'')+'"><td>'+c+'</td><td class="r">'+nf(a)+'</td><td class="r">'+nf(a*r)+'</td></tr>';
  $('#sumBody').innerHTML=row('Subtotal',t.sub)+row('Descuento',-t.disc)+row('Base imponible',t.base)+row('IVA 16 %',t.iva)+row('Total',t.total,'tot');
  $('#lcdBs').textContent=bsf(t.total*r);
  $('#lcdUsd').textContent=usd(t.total);
  $('#btnPay').disabled=!S.cart.length;
}
function renderCatalog(){
  const list=filtered();
  $('#catCount').textContent='('+list.length+' de '+S.products.length+')';
  if(S.catSel&&!list.some(p=>p.code===S.catSel))S.catSel=null;
  $('#catBody').innerHTML=list.length?list.map(p=>'<tr data-code="'+p.code+'" class="'+(p.code===S.catSel?'sel':'')+'"><td><div class="desc">'+esc(p.desc)+'</div><div class="sub">'+esc(p.brand)+' · '+p.code+'</div></td><td class="r '+stockCls(p)+'">'+fq(p.stock)+'</td><td class="r">'+nf(p.price)+'</td><td class="c"><button class="mini" data-add aria-label="Agregar '+esc(p.desc)+' a la venta">+</button></td></tr>').join(''):'<tr class="empty"><td colspan="4">Sin coincidencias.</td></tr>';
  renderDetail();
}
function renderDetail(){
  const d=$('#detail'),p=S.catSel&&prod(S.catSel);
  if(!p){d.innerHTML='<span class="dim">Seleccione un producto para ver su ubicación, existencia y precio con IVA.</span>';return;}
  d.innerHTML='<div><b>'+esc(p.desc)+'</b></div><div class="dgrid"><span>Marca</span><b>'+esc(p.brand)+'</b><span>Ubicación</span><b>Pasillo '+esc(p.loc)+'</b><span>Existencia</span><b class="'+stockCls(p)+'">'+fq(p.stock)+(p.unit==='L'?' L':' und')+' (mínimo '+fq(p.min)+')</b><span>Sin IVA</span><b>'+usd(p.price)+' · '+bsf(p.price*S.cfg.rate)+'</b><span>Con IVA 16 %</span><b>'+usd(p.price*(1+IVA))+' · '+bsf(p.price*(1+IVA)*S.cfg.rate)+'</b></div><button class="btn mini2" id="btnDetAdd">Agregar a la venta</button>';
}
function renderStatus(){
  const units=S.cart.reduce((a,l)=>a+l.qty,0);
  $('#sbCajero').textContent='Cajero: '+S.cfg.cajero+' · Caja '+S.cfg.caja;
  $('#sbRate').textContent='Tasa: '+nf(S.cfg.rate)+' Bs./US$';
  $('#sbCount').textContent='Renglones: '+S.cart.length+' · Unidades: '+fq(r2(units));
  $('#sbClock').textContent=fmtDT(Date.now());
  const b=$('#heldBadge');if(b){b.hidden=!S.held.length;b.textContent=S.held.length;}
}
function renderAll(){renderHeader();renderCart();renderCatalog();}

/* ---------- entrada de productos ---------- */
function parseEntry(v){
  const m=v.trim().match(/^(\d+(?:[.,]\d+)?)\s*\*\s*(.*)$/);
  if(m)return{qty:parseFloat(m[1].replace(',','.')),text:m[2].trim(),hasQty:true};
  return{qty:1,text:v.trim(),hasQty:false};
}
function submitEntry(){
  const entry=$('#entry'),pe=parseEntry(entry.value);
  if(!pe.text){msg('Escriba un código o una descripción.','bad');return;}
  let p=S.products.find(x=>x.code===pe.text);
  if(!p){
    const m=searchProducts(pe.text,'Todas');
    if(m.length===1)p=m[0];
    else if(!m.length){msg('No se encontró "'+pe.text+'".','bad');return;}
    else if(navigated&&S.catSel&&prod(S.catSel))p=prod(S.catSel);
    else{msg(m.length+' coincidencias: elija con ↑ ↓ y Enter, o con doble clic en el catálogo.');return;}
  }
  if(addItem(p.code,pe.qty)){entry.value='';S.query='';navigated=false;renderCatalog();}
}

/* ---------- eventos ---------- */
function wire(){
  const entry=$('#entry');
  entry.addEventListener('input',()=>{S.query=parseEntry(entry.value).text;navigated=false;renderCatalog();});
  entry.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      const list=filtered();if(!list.length)return;
      let i=list.findIndex(p=>p.code===S.catSel);
      i=e.key==='ArrowDown'?Math.min(list.length-1,i+1):Math.max(0,i<0?0:i-1);
      S.catSel=list[i].code;navigated=true;renderCatalog();
      ensureVisible($('#catBody tr.sel'),$('#catWrap'));e.preventDefault();
    }else if(e.key==='Enter'){e.preventDefault();submitEntry();}
    else if(e.key==='Escape'){entry.value='';S.query='';navigated=false;renderCatalog();}
  });
  $('#btnAdd').addEventListener('click',()=>{submitEntry();entry.focus();});
  $('#btnPay').addEventListener('click',payDlg);
  $('#btnClient').addEventListener('click',clientDlg);
  $('#sbRate').addEventListener('click',()=>cfgDlg('cRate'));
  $('#catSel').addEventListener('change',e=>{S.cat=e.target.value;renderCatalog();});

  $('#cartBody').addEventListener('click',e=>{
    const tr=e.target.closest('tr[data-i]');if(!tr)return;
    const i=+tr.dataset.i,btn=e.target.closest('[data-act]');
    S.sel=i;
    if(btn)changeQty(i,btn.dataset.act==='inc'?1:-1);else renderCart();
  });
  const addFromCatalog=code=>{
    const pe=parseEntry(entry.value);
    if(addItem(code,pe.qty)&&pe.hasQty){entry.value=pe.text;}
    entry.focus();
  };
  $('#catBody').addEventListener('click',e=>{
    const tr=e.target.closest('tr[data-code]');if(!tr)return;
    S.catSel=tr.dataset.code;
    if(e.target.closest('[data-add]')){addFromCatalog(S.catSel);}
    renderCatalog();
  });
  $('#catBody').addEventListener('dblclick',e=>{
    const tr=e.target.closest('tr[data-code]');if(tr&&!e.target.closest('[data-add]'))addFromCatalog(tr.dataset.code);
  });
  $('#detail').addEventListener('click',e=>{if(e.target.id==='btnDetAdd'&&S.catSel)addFromCatalog(S.catSel);});

  $('#menubar').addEventListener('click',e=>{
    const b=e.target.closest('[data-menu]');if(!b)return;
    if(b.classList.contains('open'))closeMenu();else openMenu(b.dataset.menu,b);
  });
  $('#menubar').addEventListener('mouseover',e=>{
    const b=e.target.closest('[data-menu]');
    if(b&&menuEl&&!b.classList.contains('open'))openMenu(b.dataset.menu,b);
  });
  $('#toolbar').addEventListener('click',e=>{
    const b=e.target.closest('[data-tb]');if(!b)return;
    const t=TB.find(x=>x[0]===b.dataset.tb);if(t)t[3]();
  });
  document.addEventListener('pointerdown',e=>{
    if(menuEl&&!e.target.closest('.menu')&&!e.target.closest('.mb'))closeMenu();
  });

  const fk={F2:newSale,F3:focusEntry,F4:clientDlg,F5:suspend,F6:recoverDlg,F7:discountDlg,F8:inventoryDlg,F9:salesDlg,F12:payDlg};
  document.addEventListener('keydown',e=>{
    if(W){if(e.key==='Escape'){e.preventDefault();closeWin();}return;}
    if(e.key==='Escape'&&menuEl){closeMenu();return;}
    if(fk[e.key]){e.preventDefault();closeMenu();fk[e.key]();return;}
    const tag=document.activeElement?document.activeElement.tagName:'';
    if(/INPUT|SELECT|TEXTAREA/.test(tag))return;
    if(e.key==='Delete'){e.preventDefault();removeSel();}
    else if(e.key==='ArrowDown'&&S.cart.length){e.preventDefault();S.sel=Math.min(S.cart.length-1,S.sel+1);renderCart();ensureVisible($('#cartBody tr.sel'),$('#cartWrap'));}
    else if(e.key==='ArrowUp'&&S.cart.length){e.preventDefault();S.sel=Math.max(0,S.sel-1);renderCart();ensureVisible($('#cartBody tr.sel'),$('#cartWrap'));}
    else if((e.key==='+'||e.key==='-')&&S.sel>=0){e.preventDefault();changeQty(S.sel,e.key==='+'?1:-1);}
  });
  setInterval(()=>{$('#fDate').value=fmtDT(Date.now());$('#sbClock').textContent=fmtDT(Date.now());},15000);
}

/* ---------- arranque ---------- */
init();
buildChrome();
renderCatOptions();
renderAll();
wire();
msg(saved?'Datos guardados cargados. Use Nueva venta (F2) para comenzar.':'Venta de ejemplo cargada. Use Nueva venta (F2) para empezar de cero.');
})();
</script>

</body></html>
