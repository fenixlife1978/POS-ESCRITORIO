name: Compilar Ejecutable Windows (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pos-el-piston-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Compilar aplicación web (Vite)
        run: npm run build

      - name: Construir instalador y ejecutable portátil de Windows (.exe)
        run: npx --yes electron-builder --win nsis portable --config electron-builder.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar instalador y ejecutable portátil (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: pos-el-piston-windows-installer-and-portable
          path: dist-exe/*.exe
          if-no-files-found: error
