name: Compilar Ejecutable Windows (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pos-el-piston-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Compilar aplicación web (Vite)
        run: npm run build

      - name: Construir instalador y ejecutable portátil de Windows (.exe)
        run: npx --yes electron-builder --win nsis portable --config electron-builder.json --publish never
      - name: Publicar instalador y ejecutable portátil en GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: POS El Pistón — Windows build ${{ github.run_number }}
          body: Instalador de Windows y versión portátil generados automáticamente por GitHub Actions.
          prerelease: true
          files: dist-exe/*.exe
          fail_on_unmatched_files: true
